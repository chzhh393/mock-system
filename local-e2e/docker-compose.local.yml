# 本地端到端测试配置
# 在同一台机器上同时运行 inner-server 和 outer-server 的所有服务
#
# 端口分配：
#   Inner: MySQL 3307, Kafka 9093, Canal 11111, scp0006 8082, target 8017
#   Outer: MySQL 3306, Kafka 9092, Canal 11112, scp0005 8080, consumer 8081, Redis 6379

version: '3.8'

services:
  # ==================== Inner 端（机器B）MySQL ====================
  mysql-inner:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: mysql-inner
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inner_gateway
    volumes:
      - ../inner-server/config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_inner_data:/var/lib/mysql
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --sync-binlog=1
      --binlog-expire-logs-seconds=604800
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway_local_net

  # ==================== Inner Canal ====================
  canal-inner:
    image: canal/canal-server:v1.1.7
    container_name: canal-inner
    ports:
      - "11111:11111"
    environment:
      - canal.auto.scan=false
      - canal.destinations=example
    volumes:
      - ./config/canal/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./config/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    depends_on:
      mysql-inner:
        condition: service_healthy
      kafka-inner:
        condition: service_healthy
    networks:
      - gateway_local_net

  # ==================== Inner 端（机器B）Kafka ====================
  kafka-inner:
    image: docker.m.daocloud.io/confluentinc/cp-kafka:7.5.0
    container_name: kafka-inner
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2@kafka-inner:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-inner:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_inner_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - gateway_local_net

  # ==================== Inner 端（机器B）应用服务 ====================
  scp0006:
    build: ../inner-server/scp0006
    container_name: scp0006
    ports:
      - "8082:8082"
    environment:
      # 连接【Outer】MySQL（本地模拟）
      - OUTER_DB_HOST=mysql-outer
      - OUTER_DB_PORT=3306
      - OUTER_DB_NAME=outer_gateway
      - OUTER_DB_USER=root
      - OUTER_DB_PASSWORD=root123
      # 连接【Inner】Kafka
      - KAFKA_BOOTSTRAP=kafka-inner:9092
      - KAFKA_TOPIC=inner_request_binlog
      # 目标服务
      - TARGET_SERVICE_URL=http://target-service:8017
    depends_on:
      mysql-inner:
        condition: service_healthy
      mysql-outer:
        condition: service_healthy
      kafka-inner:
        condition: service_healthy
      target-service:
        condition: service_started
    networks:
      - gateway_local_net

  target-service:
    build: ../inner-server/target-service
    container_name: target-service
    ports:
      - "8017:8017"
    environment:
      - SERVER_PORT=8017
      - MOCK_DELAY_MS=50
      - MOCK_ERROR_RATE=0
    networks:
      - gateway_local_net

  # ==================== Outer 端（机器A）MySQL ====================
  mysql-outer:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: mysql-outer
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: outer_gateway
    volumes:
      - ../outer-server/config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_outer_data:/var/lib/mysql
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway_local_net

  # ==================== Outer Canal ====================
  canal-outer:
    image: canal/canal-server:v1.1.7
    container_name: canal-outer
    ports:
      - "11112:11111"
    environment:
      - canal.auto.scan=false
      - canal.destinations=example
    volumes:
      - ./config/canal-outer/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./config/canal-outer/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    depends_on:
      mysql-outer:
        condition: service_healthy
      kafka-outer:
        condition: service_healthy
    networks:
      - gateway_local_net

  # ==================== Outer 端（机器A）Redis ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway_local_net

  # ==================== Outer 端（机器A）Kafka ====================
  kafka-outer:
    image: docker.m.daocloud.io/confluentinc/cp-kafka:7.5.0
    container_name: kafka-outer
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-outer:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-outer:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: OkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_outer_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - gateway_local_net

  # ==================== Outer 端（机器A）应用服务 ====================
  scp0005:
    build: ../outer-server/scp0005
    container_name: scp0005
    ports:
      - "8080:8080"
    environment:
      # 连接【Inner】MySQL（本地模拟）
      - INNER_DB_HOST=mysql-inner
      - INNER_DB_PORT=3306
      - INNER_DB_NAME=inner_gateway
      - INNER_DB_USER=root
      - INNER_DB_PASSWORD=root123
      # 本机 Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql-inner:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gateway_local_net

  outer-consumer:
    build: ../outer-server/outer-consumer
    container_name: outer-consumer
    ports:
      - "8081:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka-outer:9092
      KAFKA_TOPIC: outer_response_binlog
      RESULT_KEY_PREFIX: "gateway:result:"
    depends_on:
      redis:
        condition: service_healthy
      kafka-outer:
        condition: service_healthy
    networks:
      - gateway_local_net

volumes:
  mysql_inner_data:
  mysql_outer_data:
  kafka_inner_data:
  kafka_outer_data:
  redis_data:

networks:
  gateway_local_net:
    driver: bridge