# 机器 A（外网）Docker Compose 配置
#
# IP 地址配置：
#   机器A（外网/本机）: 192.168.123.66
#   机器B（内网）: 192.168.123.81

version: '3.8'

services:
  # ==================== 数据库 ====================
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: mysql-outer
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: outer_gateway
    volumes:
      - ./config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - outer_net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - outer_net

  # ==================== Kafka ====================
  # 使用 Confluent Kafka（KRaft 模式）
  kafka:
    image: docker.m.daocloud.io/confluentinc/cp-kafka:7.5.0
    container_name: kafka-outer
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.123.66:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: OkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - outer_net

  # ==================== Canal ====================
  canal:
    image: canal/canal-server:v1.1.7
    container_name: canal-outer
    ports:
      - "11111:11111"
    environment:
      - canal.auto.scan=false
      - canal.destinations=example
    volumes:
      - ./config/canal/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./config/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - outer_net

  # ==================== 应用服务 ====================
  scp0005:
    build: ./scp0005
    container_name: scp0005
    ports:
      - "8080:8080"
    environment:
      # 连接【内网】MySQL（机器B）- 通过强隔离装置穿透
      - INNER_DB_HOST=192.168.123.81
      - INNER_DB_PORT=3306
      - INNER_DB_NAME=inner_gateway
      - INNER_DB_USER=root
      - INNER_DB_PASSWORD=root123
      # 本机 Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - outer_net

  outer-consumer:
    build: ./outer-consumer
    container_name: outer-consumer
    ports:
      - "8081:8081"
    environment:
      # Redis 配置
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      # Kafka 配置
      - "KAFKA_BOOTSTRAP=kafka:9092"
      - "KAFKA_TOPIC=outer_response_binlog"
      # Redis key 前缀 - 与 scp0005 保持一致
      - "RESULT_KEY_PREFIX=gateway:result:"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - outer_net

volumes:
  mysql_data:
  redis_data:
  kafka_data:

networks:
  outer_net:
    driver: bridge
