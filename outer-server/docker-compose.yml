# 机器 A（外网）Docker Compose 配置
#
# 使用前请替换以下占位符：
#   __MACHINE_A_IP__ : 本机（机器A）的 IP 地址
#   __MACHINE_B_IP__ : 机器B（内网）的 IP 地址
#
# 替换命令：
#   sed -i '' "s/__MACHINE_A_IP__/192.168.1.100/g" docker-compose.yml
#   sed -i '' "s/__MACHINE_B_IP__/192.168.1.101/g" docker-compose.yml

version: '3.8'

services:
  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: mysql-outer
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: outer_gateway
    volumes:
      - ./config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - outer_net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - outer_net

  # ==================== Kafka ====================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CLUSTER_ID=4k5h6g7j-8k9l-0m1n-2p3q-4r5s6t7u8v9w
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://192.168.123.66:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - outer_net

  # ==================== Canal ====================
  # Canal 监听外网 MySQL 的响应表
  canal:
    image: canal/canal-server:v1.1.7
    container_name: canal-outer
    ports:
      - "11111:11111"
    environment:
      - canal.instance.master.address=mysql:3306
      - canal.instance.dbUsername=root
      - canal.instance.dbPassword=root123
      - canal.instance.filter.regex=outer_gateway\\.outer_response
      - canal.mq.topic=outer_response_binlog
      - canal.serverMode=kafka
      - kafka.bootstrap.servers=kafka:9092
    volumes:
      - ./config/canal:/home/admin/canal-server/conf/example
      - canal_logs:/home/admin/canal-server/logs
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - outer_net

  # ==================== 应用服务 ====================
  scp0005:
    build: ./scp0005
    container_name: scp0005
    ports:
      - "8080:8080"
    environment:
      # 连接【内网】MySQL（机器B）- 通过强隔离装置穿透
      - INNER_DB_HOST=192.168.123.65
      - INNER_DB_PORT=3306
      - INNER_DB_NAME=inner_gateway
      - INNER_DB_USER=root
      - INNER_DB_PASSWORD=root123
      # 本机 Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - outer_net

  outer-consumer:
    build: ./outer-consumer
    container_name: outer-consumer
    ports:
      - "8081:8081"
    environment:
      # Redis 配置
      - "REDIS_HOST=redis"
      - "REDIS_PORT=6379"
      # Kafka 配置
      - "KAFKA_BOOTSTRAP=kafka:9092"
      - "KAFKA_TOPIC=outer_response_binlog"
      # Redis key 前缀 - 与 scp0005 保持一致
      - "RESULT_KEY_PREFIX=gateway:result:"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - outer_net

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  canal_logs:

networks:
  outer_net:
    driver: bridge
