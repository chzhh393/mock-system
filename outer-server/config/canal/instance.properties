# Canal Instance Configuration: example (Outer)

# Slave ID (Must be unique, Inner used 1234)
canal.instance.mysql.slaveId = 1235

# MySQL 地址
canal.instance.master.address = mysql-outer:3306
canal.instance.master.journal.name = 
canal.instance.master.position = 
canal.instance.master.timestamp = 

# MySQL 用户
canal.instance.dbUsername = canal
canal.instance.dbPassword = canal123
canal.instance.connectionCharset = UTF-8

# 过滤规则 (只监听 outer_response 表)
canal.instance.filter.regex = outer_gateway\.outer_response
canal.instance.filter.black.regex = 

# 投递到 Kafka 的 Topic
canal.mq.topic = outer_response_binlog
canal.mq.partitionHash = outer_gateway.outer_response:request_id
