# 机器 B（内网）Docker Compose 配置
#
# 使用前请替换以下占位符：
#   192.168.123.66 : 机器A（外网）的 IP 地址
#   192.168.123.65 : 本机（机器B）的 IP 地址
#
# 替换命令：
#   sed -i '' "s/192.168.123.66/192.168.1.100/g" docker-compose.yml
#   sed -i '' "s/192.168.123.65/192.168.1.101/g" docker-compose.yml

version: '3.8'

services:
  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: mysql-inner
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inner_gateway
    volumes:
      - ./config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --sync-binlog=1
      --binlog-expire-logs-seconds=604800
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inner_net

  # ==================== Kafka ====================
  # 内网独立的 Kafka，不依赖外网
  kafka:
    image: apache/kafka:latest
    container_name: kafka-inner
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CLUSTER_ID=inner-5h6g7j-8k9l-0m1n-2p3q-4r5s6t7u8v9w
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:19092,EXTERNAL://192.168.123.65:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - inner_net

  # ==================== Canal ====================
  # Canal 监听内网 MySQL 的请求表，推送到【本地】Kafka
  canal:
    image: canal/canal-server:v1.1.7
    container_name: canal-inner
    ports:
      - "11111:11111"
    environment:
      - canal.instance.master.address=mysql:3306
      - canal.instance.dbUsername=root
      - canal.instance.dbPassword=root123
      - canal.instance.filter.regex=inner_gateway\\.inner_request
      - canal.mq.topic=inner_request_binlog
      - canal.serverMode=kafka
      - kafka.bootstrap.servers=kafka:19092
    volumes:
      - ./config/canal:/home/admin/canal-server/conf/example
      - canal_logs:/home/admin/canal-server/logs
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - inner_net

  # ==================== 应用服务 ====================
  scp0006:
    build: ./scp0006
    container_name: scp0006
    ports:
      - "8082:8082"
    environment:
      # 连接【外网】MySQL（机器A）- 通过强隔离装置穿透
      - OUTER_DB_HOST=192.168.123.66
      - OUTER_DB_PORT=3306
      - OUTER_DB_NAME=outer_gateway
      - OUTER_DB_USER=root
      - OUTER_DB_PASSWORD=root123
      # 连接【本地】Kafka（机器B）
      - KAFKA_BOOTSTRAP=kafka:19092
      - KAFKA_TOPIC=inner_request_binlog
      # 本机目标服务
      - TARGET_SERVICE_URL=http://target-service:8083
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      target-service:
        condition: service_started
    networks:
      - inner_net

  target-service:
    build: ./target-service
    container_name: target-service
    ports:
      - "8083:8083"
    environment:
      # Mock 配置
      - MOCK_DELAY_MS=50
      - MOCK_ERROR_RATE=0
    networks:
      - inner_net

volumes:
  mysql_data:
  kafka_data:
  canal_logs:

networks:
  inner_net:
    driver: bridge
