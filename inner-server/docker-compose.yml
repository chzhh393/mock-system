# 机器 B（内网）Docker Compose 配置
#
# IP 地址配置：
#   机器A（外网）: 192.168.123.66
#   机器B（内网/本机）: 192.168.123.81

version: '3.8'

services:
  # ==================== MySQL ====================
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: mysql-inner
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: inner_gateway
    volumes:
      - ./config/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --sync-binlog=1
      --binlog-expire-logs-seconds=604800
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inner_net

  # ==================== Kafka ====================
  # 内网独立的 Kafka，使用 Confluent 镜像（KRaft 模式）
  kafka:
    image: docker.m.daocloud.io/confluentinc/cp-kafka:7.5.0
    container_name: kafka-inner
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - inner_net

  # ==================== Canal ====================
  canal:
    image: canal/canal-server:v1.1.7
    container_name: canal-inner
    ports:
      - "11111:11111"
    environment:
      - canal.auto.scan=false
      - canal.destinations=example
    volumes:
      - ./config/canal/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./config/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - inner_net

  # ==================== 应用服务 ====================
  scp0006:
    build: ./scp0006
    container_name: scp0006
    ports:
      - "8082:8082"
    environment:
      # 连接【外网】MySQL（机器A）- 通过端口转发
      - OUTER_DB_HOST=host.docker.internal
      - OUTER_DB_PORT=3307
      - OUTER_DB_NAME=outer_gateway
      - OUTER_DB_USER=root
      - OUTER_DB_PASSWORD=root123
      # 连接【本地】Kafka（机器B）
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=inner_request_binlog
      # 本机目标服务
      - TARGET_SERVICE_URL=http://target-service:8017
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      target-service:
        condition: service_started
    networks:
      - inner_net

  target-service:
    build: ./target-service
    container_name: target-service
    ports:
      - "8017:8017"
    environment:
      - SERVER_PORT=8017
      # Mock 配置
      - MOCK_DELAY_MS=50
      - MOCK_ERROR_RATE=0
    networks:
      - inner_net

volumes:
  mysql_data:
  kafka_data:

networks:
  inner_net:
    driver: bridge
