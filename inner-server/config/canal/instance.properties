# Canal 实例配置 - 内网（机器B）
# 监听内网 MySQL 的 inner_request 表，推送到【本地】Kafka
#
# 架构说明：
#   - Canal 监听本机 MySQL 的 Binlog
#   - 推送到本机 Kafka (kafka:19092)
#   - scp0006 从本机 Kafka 消费消息

#################################################
## MySQL 数据源配置
#################################################
canal.instance.master.address=mysql-inner:3306
canal.instance.dbUsername=canal
canal.instance.dbPassword=canal123
canal.instance.connectionCharset=UTF-8

# 监听的数据库和表（正则表达式）
# 只监听 inner_gateway.inner_request 表
canal.instance.filter.regex=inner_gateway\\.inner_request

# 黑名单（不监听的表）
canal.instance.filter.black.regex=

#################################################
## Binlog 位置配置
#################################################
# 从最新位置开始
canal.instance.gtidon=false

#################################################
## MQ 配置（Kafka）
## 注意：推送到【本地】Kafka（机器B）
#################################################
canal.mq.topic=inner_request_binlog
canal.mq.partition=0

# 消息格式
canal.mq.flatMessage=true

# Kafka 地址（本机）
# 这个配置会被 docker-compose.yml 中的环境变量覆盖
# kafka.bootstrap.servers=kafka:19092
